[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-bci"
version = "0.19.0"
description = "A falsifiable research workbench for testing quantum-structured and classical neural mechanism hypotheses."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sidharth Hulyalkar"}]
keywords = [
  "neuroscience",
  "EEG",
  "BCI",
  "mechanistic interpretability",
  "foundation models",
  "quantum-inspired",
  "reproducible research",
  "preregistration",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/sidhulyalkar/QuantumBCI"
Repository = "https://github.com/sidhulyalkar/QuantumBCI"
Issues = "https://github.com/sidhulyalkar/QuantumBCI/issues"
Documentation = "https://github.com/sidhulyalkar/QuantumBCI/tree/main/docs"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "build>=1.2",
]
quantum = [
  "qiskit>=1.2",
  "qiskit-aer>=0.15",
]
neuros = [
  "neuros-core>=2.0.0",
  "neuros-foundation>=2.1.0",
]
real-eeg = [
  "neuros-core>=2.0.0",
  "neuros-models>=2.0.0",
  "neuros-foundation[evidence]>=2.1.0",
]
neuros-mechint = [
  "neuros-mechint>=1.0.0",
]

[project.scripts]
quantumbci = "quantumbci.cli:main"
quantumbci-audit = "quantumbci.audit_cli:main"
quantumbci-kumar2024 = "quantumbci.studies.kumar2024_cli:main"
quantumbci-bmrb = "quantumbci.bmrb_cli:main"
quantumbci-confirmatory = "quantumbci.confirmatory_cli:main"
quantumbci-bmrb-validate = "quantumbci.bmrb_validation_cli:main"

[project.entry-points."neuros.transforms"]
quantumbci-density = "quantumbci.integrations.neuros:DensityGeometryTransform"

[tool.setuptools.packages.find]
include = ["quantumbci*"]

[tool.setuptools.package-data]
quantumbci = [
  "experiments/manifests/*.json",
  "schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
