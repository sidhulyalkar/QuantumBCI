[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-bci"
version = "0.11.0"
description = "A falsifiable research workbench for quantum, quantum-inspired, and classical models of neural signals."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sidharth Hulyalkar"}]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
quantum = [
  "qiskit>=1.2",
  "qiskit-aer>=0.15",
]
neuros = [
  "neuros-core>=2.0.0",
  "neuros-foundation>=2.1.0",
]
real-eeg = [
  "neuros-core>=2.0.0",
  "neuros-models>=2.0.0",
  "neuros-foundation[evidence]>=2.1.0",
]
neuros-mechint = [
  "neuros-mechint>=1.0.0",
]

[project.scripts]
quantumbci = "quantumbci.cli:main"
quantumbci-audit = "quantumbci.audit_cli:main"
quantumbci-kumar2024 = "quantumbci.studies.kumar2024_cli:main"

[project.entry-points."neuros.transforms"]
quantumbci-density = "quantumbci.integrations.neuros:DensityGeometryTransform"

[tool.setuptools.packages.find]
include = ["quantumbci*"]

[tool.setuptools.package-data]
quantumbci = [
  "experiments/manifests/*.json",
  "schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
