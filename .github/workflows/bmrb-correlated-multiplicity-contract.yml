name: BMRB correlated multiplicity contract

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quantumbci-bmrb-correlated-multiplicity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  correlated-multiplicity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - name: Qualify block-correlated search semantics
        run: |
          python -m pytest -q tests/test_bmrb_multiplicity_correlated.py

      - name: Static-check correlated multiplicity surfaces
        run: |
          python -m ruff check \
            quantumbci/bmrb_multiplicity_correlated.py \
            tests/test_bmrb_multiplicity_correlated.py

      - name: Qualify installed correlated search surface
        run: |
          python - <<'PY'
          from quantumbci.bmrb_multiplicity_correlated import (
              BMRB_CORRELATED_MULTIPLICITY_BENCHMARK,
              run_bmrb_correlated_multiplicity_stress,
          )

          result = run_bmrb_correlated_multiplicity_stress(
              family_replicates=8,
              candidate_count=20,
              independent_draw_counts=(1, 2, 5, 20),
              participants=4,
              bootstrap_resamples=100,
              seed=5901,
          )
          assert result['benchmark'] == BMRB_CORRELATED_MULTIPLICITY_BENCHMARK
          assert result['primary_result_invariant'] is True
          assert result['naive_survival_nested'] is True
          assert result['one_draw_equals_primary'] is True

          conditions = {item['independent_draws']: item for item in result['conditions']}
          assert conditions[1]['winner_picking_amplification'] == 0.0
          assert conditions[20]['winner_picking_amplification'] > 0.0
          assert conditions[20]['naive_any_survivor_rate'] > conditions[1][
              'naive_any_survivor_rate'
          ]
          assert len({
              item['authorized_primary_promotion_rate']
              for item in result['conditions']
          }) == 1
          PY

      - name: Keep correlated-search claim boundary explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('quantumbci/bmrb_multiplicity_correlated.py').read_text(encoding='utf-8')
          docs = Path('docs/BMRB_CORRELATED_SEARCH_STRESS.md').read_text(encoding='utf-8')
          seal = Path('quantumbci/bmrb_evaluation_seal.py').read_text(encoding='utf-8')

          assert 'does not validate biological truth' in source
          assert 'physical-quantum' in source
          assert 'does not execute the frozen final-evaluation partition' in docs
          assert 'validate biological truth' in docs
          assert 'physical-quantum' in docs
          assert 'does not execute the final evaluation partition' in seal
          assert 'run_bmrb_operating_characteristics' not in seal
          PY

      - name: Qualify wheel contents
        run: |
          rm -rf /tmp/qbc-correlated-multiplicity-wheel
          python -m pip wheel . --no-deps --wheel-dir /tmp/qbc-correlated-multiplicity-wheel
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path('/tmp/qbc-correlated-multiplicity-wheel').glob('quantum_bci-*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert 'quantumbci/bmrb_multiplicity_correlated.py' in names
          PY
