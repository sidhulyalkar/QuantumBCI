name: E002 switching-state contract

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quantumbci-e002-switching-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - name: Qualify switching-state kernel and authority-bound task
        run: |
          python -m pytest -q tests/test_switching_dynamics.py tests/test_switching_state_task.py

      - name: Qualify safe root switching surface
        run: |
          python - <<'PY'
          import quantumbci
          assert quantumbci.SWITCHING_MODEL_ID == 'two_regime_markov_switching_affine_var1_v1'
          assert quantumbci.SWITCHING_SCORE_ID == 'sequential_gaussian_mixture_nll_v1'
          assert quantumbci.REGIME_COUNT == 2
          assert callable(quantumbci.fit_switching_affine_var)
          assert callable(quantumbci.score_switching_affine_var)
          assert callable(quantumbci.run_switching_state_control)
          assert quantumbci.LABEL_CANONICALIZATION_ID == 'lexicographic_rounded_regime_parameter_vector_v1'
          PY

      - name: Build switching fixed-step evidence fixture
        run: |
          mkdir -p /tmp/e002-switching
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np

          root = Path('/tmp/e002-switching')
          rng = np.random.default_rng(113)
          transitions = np.asarray([
              [
                  [0.90, 0.16, 0.00],
                  [-0.10, 0.84, 0.06],
                  [0.03, -0.07, 0.86],
              ],
              [
                  [0.73, -0.20, 0.07],
                  [0.18, 0.78, -0.10],
                  [-0.04, 0.13, 0.80],
              ],
          ], dtype=float)
          intercepts = np.asarray([
              [0.010, -0.006, 0.004],
              [-0.012, 0.010, -0.005],
          ], dtype=float)
          variances = np.asarray([
              [0.0012, 0.0010, 0.0009],
              [0.0010, 0.0011, 0.0012],
          ], dtype=float)
          regime_transition = np.asarray([[0.95, 0.05], [0.07, 0.93]], dtype=float)
          n_trajectories = 8
          n_steps = 68
          states = []
          ids = []
          for trajectory in range(n_trajectories):
              state = rng.normal(0.0, 0.16, size=3)
              regime = trajectory % 2
              for step in range(n_steps):
                  if step > 0:
                      regime = int(rng.choice(2, p=regime_transition[regime]))
                      state = (
                          transitions[regime] @ state
                          + intercepts[regime]
                          + rng.normal(0.0, np.sqrt(variances[regime]))
                      )
                  states.append(state.copy())
                  ids.append(f'trajectory-{trajectory}')
          states = np.asarray(states, dtype=float)
          starts = np.tile(np.arange(n_steps, dtype=float), n_trajectories)
          stops = starts + 0.5
          np.save(root / 'states.npy', states)
          np.save(root / 'ids.npy', np.asarray(ids))
          np.save(root / 'starts.npy', starts)
          np.save(root / 'stops.npy', stops)

          fit = []
          calibration = []
          evaluation = []
          for trajectory in range(n_trajectories):
              base = trajectory * n_steps
              fit.extend(range(base, base + 40))
              calibration.extend(range(base + 40, base + 54))
              evaluation.extend(range(base + 54, base + n_steps))

          descriptor = {
              'schema_version': 1,
              'dataset_id': 'ci-v012-switching',
              'case_id': 'ci-v012-case',
              'latent_dimension': 3,
              'time_step_policy': 'fixed',
              'expected_window_seconds': 0.5,
              'expected_step_seconds': 1.0,
              'step_tolerance_seconds': 1e-12,
              'purge_seconds': 0.0,
              'upstream_authority_fingerprint': 'neuros-ci-v012',
              'source_revisions': {'quantumbci': 'ci-v012', 'encoder': 'frozen-ci'},
              'data_metadata': {
                  'state_surface': 'observed_coordinates',
                  'fixture': 'switching-v012',
              },
              'data': {
                  'states': 'states.npy',
                  'trajectory_ids': 'ids.npy',
                  'start_times_s': 'starts.npy',
                  'stop_times_s': 'stops.npy',
              },
              'split': {
                  'fit_indices': fit,
                  'calibration_indices': calibration,
                  'evaluation_indices': evaluation,
                  'representation_fit_indices': fit,
              },
          }
          (root / 'trajectory_contract.json').write_text(
              json.dumps(descriptor, indent=2), encoding='utf-8'
          )
          PY

      - name: Materialize v0.8 through v0.11 evidence chain
        run: |
          cd /tmp/e002-switching
          python -m quantumbci.experiments.tasks \
            trajectory-contract E002 \
            --input trajectory_contract.json \
            --output trajectory_index.json \
            > trajectory_stdout.json
          python -m quantumbci.experiments.tasks \
            fit-matched-dynamics E002 \
            --input trajectory_contract.json \
            --trajectory-index trajectory_index.json \
            --output matched_dynamics.json \
            --ridge 0 \
            > matched_stdout.json
          python -m quantumbci.experiments.classical_controls_task \
            --descriptor trajectory_contract.json \
            --trajectory-index trajectory_index.json \
            --matched matched_dynamics.json \
            --output classical_controls.json \
            > controls_stdout.json
          python -m quantumbci.experiments.probabilistic_ssm_task \
            --descriptor trajectory_contract.json \
            --trajectory-index trajectory_index.json \
            --matched matched_dynamics.json \
            --classical-controls classical_controls.json \
            --output probabilistic_ssm.json \
            > probabilistic_stdout.json

      - name: Qualify installed v0.12 switching-state stage
        run: |
          cd /tmp/e002-switching
          python -m quantumbci.experiments.switching_state_task \
            --descriptor trajectory_contract.json \
            --trajectory-index trajectory_index.json \
            --matched matched_dynamics.json \
            --classical-controls classical_controls.json \
            --probabilistic-ssm probabilistic_ssm.json \
            --output switching_state.json \
            > switching_stdout.json
          python - <<'PY'
          import json
          artifact = json.load(open('switching_state.json'))
          probabilistic = json.load(open('probabilistic_ssm.json'))
          assert artifact['status'] == 'pass'
          assert artifact['artifact_role'] == 'switching_state_classical_control'
          assert artifact['upstream_probabilistic_artifact_verified'] is True
          assert artifact['upstream_probabilistic_artifact_reconstructed'] is True
          assert artifact['authority_fingerprint'] == probabilistic['authority_fingerprint']
          assert artifact['data_sha256'] == probabilistic['data_sha256']
          assert artifact['fit_transition_sha256'] == probabilistic['fit_transition_sha256']
          assert artifact['calibration_transition_sha256'] == probabilistic['calibration_transition_sha256']
          assert artifact['evaluation_transition_sha256'] == probabilistic['evaluation_transition_sha256']
          model = artifact['model']
          assert model['model_id'] == 'two_regime_markov_switching_affine_var1_v1'
          assert model['regime_count'] == 2
          assert model['parameter_count'] == 33
          assert model['regime_labels_mechanistically_identifiable'] is False
          assert model['label_canonicalization_id'] == 'lexicographic_rounded_regime_parameter_vector_v1'
          diagnostics = artifact['multistart_diagnostics']
          assert diagnostics['success_count'] + diagnostics['failure_count'] == 4
          assert diagnostics['success_count'] >= 1
          assert diagnostics['best_initialization_id'] == model['selected_initialization']
          assert abs(diagnostics['best_fit_log_likelihood'] - model['fit_log_likelihood']) < 1e-10
          assert artifact['role_boundary_regime_belief_reset'] is True
          assert artifact['sequential_predictive_density_complete'] is True
          assert artifact['switching_state_control_complete'] is True
          assert artifact['exact_open_loop_switching_forecast_complete'] is False
          assert artifact['open_loop_promotion_eligible'] is False
          assert artifact['flexible_nonlinear_control_required_when_powered'] is True
          assert artifact['bootstrap_stability_required'] is True
          assert artifact['intervention_direction_evidence_required'] is True
          assert artifact['intervention_stage_eligible'] is False
          assert artifact['dynamical_information_novel'] is False
          assert artifact['physical_quantum_promotion_eligible'] is False
          assert artifact['evaluation_metrics']['score_id'] == 'sequential_gaussian_mixture_nll_v1'
          assert artifact['evaluation_metrics']['n_transitions'] > 0
          assert set(artifact['matched_sequential_comparisons']) == {
              'direct_gaussian_var_minus_switching_mean_nll',
              'kalman_minus_switching_mean_nll',
              'direct_gaussian_var_minus_switching_rmse',
              'kalman_minus_switching_rmse',
          }
          assert '/tmp/' not in json.dumps(artifact)
          PY

      - name: Reject tampered v0.11 evidence before switching fit
        run: |
          cd /tmp/e002-switching
          cp probabilistic_ssm.json probabilistic_tampered.json
          python - <<'PY'
          import json
          path = 'probabilistic_tampered.json'
          payload = json.load(open(path))
          payload['selected_q_scale'] = float(payload['selected_q_scale']) * 3.0
          open(path, 'w').write(json.dumps(payload))
          PY
          rm -f should_not_exist.json
          set +e
          python -m quantumbci.experiments.switching_state_task \
            --descriptor trajectory_contract.json \
            --trajectory-index trajectory_index.json \
            --matched matched_dynamics.json \
            --classical-controls classical_controls.json \
            --probabilistic-ssm probabilistic_tampered.json \
            --output should_not_exist.json \
            > tamper_stdout.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -f should_not_exist.json
          python - <<'PY'
          import json
          payload = json.load(open('tamper_stdout.json'))
          assert payload['status'] == 'error'
          assert 'independent v0.11 reconstruction' in payload['message']
          PY

      - name: Keep intervention route fail-closed
        run: |
          set +e
          python -m quantumbci.experiments.tasks dynamics-interventions E002 > /tmp/v012-interventions.json
          code=$?
          set -e
          test "$code" -eq 3
          python - <<'PY'
          import json
          assert json.load(open('/tmp/v012-interventions.json'))['status'] == 'not_implemented'
          PY

      - name: Qualify manifest identity and wheel contents
        run: |
          quantumbci experiments validate E002_lindblad_dynamics --json
          python - <<'PY'
          from pathlib import Path
          import json
          source = json.loads(Path('experiments/manifests/E002_lindblad_dynamics.json').read_text())
          packaged = json.loads(Path('quantumbci/experiments/manifests/E002_lindblad_dynamics.json').read_text())
          assert source == packaged
          stages = {stage['id']: stage for stage in source['stages']}
          switching = stages['fit_switching_state_control']
          assert switching['depends_on'] == ['fit_probabilistic_state_space_control']
          assert switching['command'][:3] == [
              'python', '-m', 'quantumbci.experiments.switching_state_task'
          ]
          for required in (
              '--descriptor', 'trajectory_contract.json',
              '--trajectory-index', 'trajectory_index.json',
              '--matched', 'matched_dynamics.json',
              '--classical-controls', 'classical_controls.json',
              '--probabilistic-ssm', 'probabilistic_ssm.json',
              '--output', 'switching_state.json',
          ):
              assert required in switching['command']
          assert switching['produces'] == ['switching_state.json']
          assert stages['interventions']['depends_on'] == [
              'fit_matched_baseline',
              'fit_extended_classical_controls',
              'fit_probabilistic_state_space_control',
              'fit_switching_state_control',
          ]
          PY
          python -m pip wheel . --no-deps --wheel-dir /tmp/quantumbci-switching-wheel
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import zipfile
          wheels = list(Path('/tmp/quantumbci-switching-wheel').glob('quantum_bci-*.whl'))
          assert len(wheels) == 1, wheels
          installed_version = version('quantum-bci')
          assert f'quantum_bci-{installed_version}-' in wheels[0].name
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          expected = {
              'quantumbci/switching_dynamics.py',
              'quantumbci/experiments/switching_state_task.py',
              'quantumbci/probabilistic_ssm.py',
              'quantumbci/experiments/probabilistic_ssm_task.py',
              'quantumbci/experiments/manifests/E002_lindblad_dynamics.json',
          }
          missing = sorted(expected - names)
          assert not missing, f'switching-state files missing from wheel: {missing}'
          PY
