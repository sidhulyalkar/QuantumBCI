name: BMRB multiplicity authority contract

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quantumbci-bmrb-multiplicity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  multiplicity-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - name: Qualify closed-world multiplicity semantics
        run: |
          python -m pytest -q \
            tests/test_bmrb_multiplicity.py \
            tests/test_bmrb_multiplicity_stress.py

      - name: Static-check multiplicity surfaces
        run: |
          python -m ruff check \
            quantumbci/bmrb_multiplicity.py \
            quantumbci/bmrb_multiplicity_stress.py \
            tests/test_bmrb_multiplicity.py \
            tests/test_bmrb_multiplicity_stress.py

      - name: Prove installed winner-picking trap is blocked
        run: |
          python - <<'PY'
          from quantumbci.bmrb_multiplicity import (
              BMRBMultiplicityPlan,
              apply_multiplicity_plan,
              winner_picking_demo_plan,
          )

          plan = winner_picking_demo_plan(exploratory_candidates=19)
          results = {candidate_id: False for candidate_id in plan.candidate_ids}
          results['mechanism-exploratory-07'] = True
          results['mechanism-exploratory-14'] = True
          decision = apply_multiplicity_plan(plan, results)

          assert decision.naive_any_survivor is True
          assert decision.authorized_any_promotion is False
          assert decision.suppressed_nonprimary_survivors == (
              'mechanism-exploratory-07',
              'mechanism-exploratory-14',
          )
          assert BMRBMultiplicityPlan.from_mapping(plan.to_mapping()) == plan
          assert decision.to_mapping()['physical_quantum_promotion_eligible'] is False
          PY

      - name: Qualify installed candidate-search stress
        run: |
          python - <<'PY'
          from quantumbci.bmrb_multiplicity_stress import run_bmrb_multiplicity_stress

          result = run_bmrb_multiplicity_stress(
              family_replicates=8,
              candidate_count=20,
              participants=4,
              bootstrap_resamples=100,
              seed=5901,
          )
          assert result['benchmark'] == 'BMRB_CANDIDATE_SEARCH_MULTIPLICITY_STRESS_V1'
          assert result['scenario']['reference_effect'] < result['scenario'][
              'validation_effect_threshold'
          ]
          assert result['naive_any_survivor_rate'] > result[
              'authorized_primary_promotion_rate'
          ]
          assert result['winner_picking_amplification'] > 0.0
          assert result['mean_suppressed_nonprimary_survivors'] > 0.0
          PY

      - name: Keep multiplicity claim boundary explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('quantumbci/bmrb_multiplicity.py').read_text(encoding='utf-8')
          stress = Path('quantumbci/bmrb_multiplicity_stress.py').read_text(encoding='utf-8')
          docs = Path('docs/BMRB_MULTIPLICITY.md').read_text(encoding='utf-8')
          seal = Path('quantumbci/bmrb_evaluation_seal.py').read_text(encoding='utf-8')

          assert 'does not silently' in source
          assert 'not hidden promotion switches' in source
          assert 'closed-world' in source
          assert 'physical_quantum_promotion_eligible' in source
          assert 'production ``run_validation_replicate`` path' in stress
          assert 'does not validate biological truth' in stress
          assert 'does not validate biological truth' in docs
          assert 'physical-quantum' in docs.lower()
          assert 'does not execute the final evaluation partition' in seal
          assert 'run_bmrb_operating_characteristics' not in seal
          PY

      - name: Qualify wheel contents
        run: |
          rm -rf /tmp/qbc-multiplicity-wheel
          python -m pip wheel . --no-deps --wheel-dir /tmp/qbc-multiplicity-wheel
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path('/tmp/qbc-multiplicity-wheel').glob('quantum_bci-*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          expected = {
              'quantumbci/bmrb_multiplicity.py',
              'quantumbci/bmrb_multiplicity_stress.py',
          }
          missing = sorted(expected - names)
          assert not missing, missing
          PY
