name: BMRB repeated-case reliability contract

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quantumbci-bmrb-reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Qualify BMRB kernels
        run: python -m pytest -q tests/test_reliability.py tests/test_recapitulation.py tests/test_bmrb.py
      - name: Qualify public API
        run: |
          python - <<'PY'
          import quantumbci
          assert quantumbci.RELIABILITY_BOOTSTRAP_METHOD_ID == 'participant_primary_hierarchical_bootstrap_v1'
          assert quantumbci.ICC_METHOD_ID == 'icc_a1_two_way_random_absolute_agreement_balanced_v1'
          assert callable(quantumbci.audit_repeated_case_reliability)
          assert callable(quantumbci.build_bmrb_dynamics_bundle)
          assert quantumbci.bmrb_dynamics_signature().inference_unit == 'participant'
          PY
      - name: Exercise installed CLI
        run: |
          rm -rf /tmp/quantumbci-bmrb && mkdir -p /tmp/quantumbci-bmrb
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('/tmp/quantumbci-bmrb')
          cases = []
          for p in range(1, 4):
              for s in range(1, 3):
                  point = {
                      'omega_x': 0.6 + 0.2*p + 0.01*s,
                      'omega_z': -0.4 - 0.1*p - 0.01*s,
                      'gamma_dephasing': 0.15 + 0.02*p,
                      'gamma_relaxation': 0.24 + 0.02*p,
                      'canonical_structure_residual': 0.08 + 0.01*p,
                      'canonical_minus_affine_one_step_rmse': 0.03,
                      'canonical_minus_affine_rollout_rmse': 0.05,
                      'direct_minus_nonlinear_mean_nll': 0.02,
                      'direct_minus_nonlinear_one_step_rmse': 0.01,
                  }
                  artifact = {
                      'experiment':'E002','claim_class':'quantum_inspired',
                      'artifact_role':'bootstrap_stability_evidence','status':'pass',
                      'evaluation_resampled':False,'single_case_bootstrap_is_icc':False,
                      'stability_gate_defined':False,'predictive_adversary_ladder_complete':True,
                      'dynamical_information_novel':False,
                      'authority_fingerprint':f'a-{p}-{s}','data_sha256':f'd-{p}-{s}',
                      'point_estimates':point,
                  }
                  name = f'p{p}-s{s}.json'
                  (root/name).write_text(json.dumps(artifact), encoding='utf-8')
                  cases.append({'participant_id':f'p{p}','occasion_id':f's{s}','case_id':f'p{p}-s{s}','artifact':name})
          (root/'cases.json').write_text(json.dumps({'schema_version':1,'study_id':'ci-v015','cases':cases}), encoding='utf-8')
          PY
          cd /tmp/quantumbci-bmrb
          quantumbci-bmrb dynamics cases.json --resamples 100 --seed 1501 --output-dir report
          python - <<'PY'
          import json
          payload = json.load(open('report/bmrb_dynamics.json'))
          profile = payload['mechanism_profile']
          assert profile['evidence_coverage_tier'] == 'repeated_case'
          assert profile['promotion_ceiling'] == 'descriptive'
          assert profile['first_failing_gate'] == 'matched_classical_adversaries'
          assert profile['necessity_claim_permitted'] is False
          rows = {row['estimate_name']: row for row in payload['reliability']['results']}
          assert rows['omega_x']['icc'] is not None
          assert rows['gamma_relaxation']['icc'] is not None
          assert rows['direct_minus_nonlinear_mean_nll']['icc'] is None
          assert 'degenerate' in rows['direct_minus_nonlinear_mean_nll']['icc_unavailable_reason']
          PY
          test -s report/report.html
      - name: Qualify wheel contents
        run: |
          rm -rf /tmp/quantumbci-bmrb-wheel
          python -m pip wheel . --no-deps --wheel-dir /tmp/quantumbci-bmrb-wheel
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheel = next(Path('/tmp/quantumbci-bmrb-wheel').glob('quantum_bci-*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          expected = {'quantumbci/reliability.py','quantumbci/recapitulation.py','quantumbci/bmrb.py','quantumbci/bmrb_cli.py'}
          assert not (expected - names)
          PY
