name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quantumbci-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q

  workbench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Qualify installed console surface
        run: |
          quantumbci --version
          quantumbci-audit --help
          quantumbci doctor --json
          quantumbci experiments list --json
          quantumbci experiments validate experiments/manifests/E001_density_geometry.json --json
          quantumbci smoke --seed 11 --output-root /tmp/quantumbci-smoke --json
          test -f /tmp/quantumbci-smoke/*/run.json
          test -f /tmp/quantumbci-smoke/*/report.html
      - name: Qualify installed recipe and evidence sharing surface
        run: |
          mkdir -p /tmp/quantumbci-recipe
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np

          root = Path('/tmp/quantumbci-recipe')
          rng = np.random.default_rng(21)
          t = np.linspace(0.0, 2.0 * np.pi, 32, endpoint=False)
          windows = []
          labels = []
          for index in range(80):
              label = index % 2
              a = np.sin(t + 0.07 * index)
              sign = 1.0 if label else -1.0
              x = np.stack([a, sign * a, np.cos(2 * t), np.sin(3 * t)], axis=1)
              x += rng.normal(0.0, 0.02, size=x.shape)
              windows.append(x)
              labels.append(label)
          np.save(root / 'embeddings.npy', np.stack(windows))
          np.save(root / 'labels.npy', np.asarray(labels))
          np.save(root / 'train.npy', np.arange(60))
          np.save(root / 'test.npy', np.arange(60, 80))
          (root / 'recipe.json').write_text(json.dumps({
              'schema_version': 1,
              'id': 'ci-public-recipe',
              'title': 'CI portable recipe',
              'claim_class': 'quantum_inspired',
              'evidence_tier': 'synthetic_sanity',
              'source_dataset': 'synthetic:ci',
              'source_model': 'synthetic-correlated-latents-v1',
              'data': {
                  'embeddings': 'embeddings.npy',
                  'labels': 'labels.npy',
                  'train_indices': 'train.npy',
                  'test_indices': 'test.npy',
                  'split_name': 'fixed-heldout',
              },
              'benchmark': {'ridge': 0.001},
          }), encoding='utf-8')
          (root / 'quantumbci.json').write_text(json.dumps({
              'schema_version': 1,
              'artifact_root': 'runs',
              'default_seed': 0,
              'source_sha': 'ci-workbench',
          }), encoding='utf-8')
          PY
          quantumbci recipe validate /tmp/quantumbci-recipe/recipe.json --json
          quantumbci recipe run /tmp/quantumbci-recipe/recipe.json --config /tmp/quantumbci-recipe/quantumbci.json --json > /tmp/quantumbci-recipe/run-result.json
          RUN_ID=$(python -c "import json; print(json.load(open('/tmp/quantumbci-recipe/run-result.json'))['run_id'])")
          quantumbci runs verify "$RUN_ID" --config /tmp/quantumbci-recipe/quantumbci.json --json
          quantumbci runs export "$RUN_ID" --config /tmp/quantumbci-recipe/quantumbci.json --format ro-crate --output /tmp/quantumbci-recipe/crate --json
          quantumbci runs export "$RUN_ID" --config /tmp/quantumbci-recipe/quantumbci.json --format bids --output /tmp/quantumbci-recipe/bids --bids-version 1.11.1 --source-dataset-url https://example.org/ci --json
          test -f /tmp/quantumbci-recipe/crate/ro-crate-metadata.json
          test -f /tmp/quantumbci-recipe/crate/ro-crate-preview.html
          test -f /tmp/quantumbci-recipe/bids/derivatives/quantumbci/dataset_description.json
      - name: Qualify installed equivalence-first E001 surface
        run: |
          quantumbci-audit density /tmp/quantumbci-recipe/embeddings.npy --json > /tmp/quantumbci-recipe/density-audit.json
          quantumbci-audit e001 /tmp/quantumbci-recipe/embeddings.npy /tmp/quantumbci-recipe/labels.npy \
            --train-indices /tmp/quantumbci-recipe/train.npy \
            --test-indices /tmp/quantumbci-recipe/test.npy \
            --output /tmp/quantumbci-recipe/e001-audit.json \
            --json > /tmp/quantumbci-recipe/e001-stdout.json
          python -m quantumbci.experiments.tasks equivalence-audit E001 density-covariance \
            --output /tmp/quantumbci-recipe/equivalence_audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/quantumbci-recipe')
          density = json.loads((root / 'density-audit.json').read_text())
          e001 = json.loads((root / 'e001-audit.json').read_text())
          gate = json.loads((root / 'equivalence_audit.json').read_text())
          assert density['equivalent_within_tolerance'] is True
          assert density['novel_information'] is False
          assert e001['density_information_novel'] is False
          assert e001['equivalence_audit']['equivalent_within_tolerance'] is True
          assert gate['status'] == 'pass'
          assert gate['representation_information_novel'] is False
          PY
      - name: Qualify wheel contents
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/quantumbci-wheel
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path('/tmp/quantumbci-wheel').glob('quantum_bci-*.whl'))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          expected = {
              'quantumbci/experiments/manifests/E001_density_geometry.json',
              'quantumbci/experiments/manifests/E002_lindblad_dynamics.json',
              'quantumbci/experiments/manifests/E003_contextual_order.json',
              'quantumbci/experiments/manifests/E004_quantum_resource_sandbox.json',
              'quantumbci/schemas/recipe-v1.schema.json',
              'quantumbci/audit_cli.py',
              'quantumbci/equivalence.py',
              'quantumbci/longitudinal.py',
          }
          missing = sorted(expected - names)
          assert not missing, f'public package data/modules missing from wheel: {missing}'
          PY

  neuros-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QuantumBCI
        uses: actions/checkout@v4
      - name: Checkout merged neurOS longitudinal authority
        uses: actions/checkout@v4
        with:
          repository: sidhulyalkar/neurOS-v1
          ref: ffa28ed552dc75158b673fdcd70729b1c9c69b47
          path: _deps/neuros-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install merged neurOS public contracts
        run: |
          python -m pip install -e _deps/neuros-v1/packages/neuros-core
          python -m pip install -e _deps/neuros-v1/packages/neuros-models
          python -m pip install -e _deps/neuros-v1/packages/neuros-foundation
      - run: python -m pip install -e '.[dev]'
      - name: Qualify real neurOS bridge and authoritative E001 case
        run: >-
          python -m pytest -q
          tests/test_neuros_integration.py
          tests/test_neuros_real_contracts.py
