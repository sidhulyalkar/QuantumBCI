name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quantumbci-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q

  workbench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Qualify installed console surface
        run: |
          quantumbci --version
          quantumbci doctor --json
          quantumbci experiments list --json
          quantumbci experiments validate experiments/manifests/E001_density_geometry.json --json
          quantumbci smoke --seed 11 --output-root /tmp/quantumbci-smoke --json
          test -f /tmp/quantumbci-smoke/*/run.json
          test -f /tmp/quantumbci-smoke/*/report.html
      - name: Qualify wheel contents
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/quantumbci-wheel
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path('/tmp/quantumbci-wheel').glob('quantum_bci-*.whl'))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          expected = {
              'quantumbci/experiments/manifests/E001_density_geometry.json',
              'quantumbci/experiments/manifests/E002_lindblad_dynamics.json',
              'quantumbci/experiments/manifests/E003_contextual_order.json',
              'quantumbci/experiments/manifests/E004_quantum_resource_sandbox.json',
          }
          missing = sorted(expected - names)
          assert not missing, f'manifests missing from wheel: {missing}'
          PY

  neuros-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QuantumBCI
        uses: actions/checkout@v4
      - name: Checkout pinned neurOS compatibility source
        uses: actions/checkout@v4
        with:
          repository: sidhulyalkar/neurOS-v1
          ref: 2e1a3c2d57fbba6b8b318d26639abb52bff930a5
          path: _deps/neuros-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install pinned neurOS public contracts
        run: |
          python -m pip install -e _deps/neuros-v1/packages/neuros-core
          python -m pip install -e _deps/neuros-v1/packages/neuros-models
          python -m pip install -e _deps/neuros-v1/packages/neuros-foundation
      - run: python -m pip install -e '.[dev]'
      - name: Qualify real neurOS bridge
        run: >-
          python -m pytest -q
          tests/test_neuros_integration.py
          tests/test_neuros_real_contracts.py
