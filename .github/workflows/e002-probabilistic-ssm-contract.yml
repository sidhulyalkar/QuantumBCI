name: E002 probabilistic state-space contract

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quantumbci-e002-probabilistic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - name: Qualify v0.11 probabilistic kernel and authority-bound task
        run: |
          python -m pytest -q tests/test_probabilistic_ssm.py tests/test_probabilistic_ssm_task.py

      - name: Qualify safe root probabilistic surface
        run: |
          python - <<'PY'
          import quantumbci
          assert quantumbci.PROBABILISTIC_MODEL_ID == 'identity_observation_diagonal_noise_kalman_v1'
          assert quantumbci.DIRECT_GAUSSIAN_BASELINE_ID == 'gaussian_var1_diagonal_innovation_v1'
          assert callable(quantumbci.fit_base_innovation_variance)
          assert callable(quantumbci.score_direct_gaussian_var)
          assert callable(quantumbci.score_identity_observation_kalman)
          assert not hasattr(quantumbci, 'run_probabilistic_state_space_control')
          PY

      - name: Qualify v0.11 immediate downstream handoff
        run: |
          quantumbci experiments validate E002_lindblad_dynamics --json
          python - <<'PY'
          from pathlib import Path
          import json
          source = json.loads(Path('experiments/manifests/E002_lindblad_dynamics.json').read_text())
          packaged = json.loads(Path('quantumbci/experiments/manifests/E002_lindblad_dynamics.json').read_text())
          assert source == packaged
          stages = {stage['id']: stage for stage in source['stages']}
          stage = stages['fit_probabilistic_state_space_control']
          child = stages['fit_switching_state_control']
          assert stage['depends_on'] == ['fit_extended_classical_controls']
          assert stage['command'][:3] == [
              'python', '-m', 'quantumbci.experiments.probabilistic_ssm_task'
          ]
          assert stage['produces'] == ['probabilistic_ssm.json']
          assert child['depends_on'] == ['fit_probabilistic_state_space_control']
          assert child['command'][:3] == [
              'python', '-m', 'quantumbci.experiments.switching_state_task'
          ]
          PY

      - name: Keep intervention route fail-closed
        run: |
          set +e
          python -m quantumbci.experiments.tasks dynamics-interventions E002 > /tmp/v011-interventions.json
          code=$?
          set -e
          test "$code" -eq 3
          python - <<'PY'
          import json
          assert json.load(open('/tmp/v011-interventions.json'))['status'] == 'not_implemented'
          PY

      - name: Qualify v0.11 wheel contents
        run: |
          rm -rf /tmp/quantumbci-probabilistic-wheel
          python -m pip wheel . --no-deps --wheel-dir /tmp/quantumbci-probabilistic-wheel
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheels = list(Path('/tmp/quantumbci-probabilistic-wheel').glob('quantum_bci-*.whl'))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          expected = {
              'quantumbci/probabilistic_ssm.py',
              'quantumbci/experiments/probabilistic_ssm_task.py',
              'quantumbci/classical_dynamics.py',
              'quantumbci/experiments/classical_controls_task.py',
              'quantumbci/experiments/manifests/E002_lindblad_dynamics.json',
          }
          assert not sorted(expected - names)
          PY
