name: BMRB known-truth validation contract

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quantumbci-bmrb-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  known-truth-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - name: Qualify known-truth benchmark behavior
        run: |
          python -m pytest -q \
            tests/test_bmrb_validation.py \
            tests/test_bmrb_validation_stress.py \
            tests/test_bmrb_validation_dependence.py \
            tests/test_bmrb_validation_operating.py \
            tests/test_bmrb_evaluation_seal.py

      - name: Static-check validation surfaces
        run: |
          python -m ruff check \
            quantumbci/bmrb_validation.py \
            quantumbci/bmrb_validation_stress.py \
            quantumbci/bmrb_validation_dependence.py \
            quantumbci/bmrb_validation_operating.py \
            quantumbci/bmrb_validation_operating_artifacts.py \
            quantumbci/bmrb_evaluation_seal.py \
            quantumbci/bmrb_validation_cli.py \
            tests/test_bmrb_validation.py \
            tests/test_bmrb_validation_stress.py \
            tests/test_bmrb_validation_dependence.py \
            tests/test_bmrb_validation_operating.py \
            tests/test_bmrb_evaluation_seal.py

      - name: Qualify installed validation CLI
        run: |
          quantumbci-bmrb-validate --version
          quantumbci-bmrb-validate \
            --replicates 4 \
            --participants 8 \
            --bootstrap-resamples 100 \
            --seed 1901 \
            --extended \
            --output /tmp/bmrb-validation.json \
            --require-qualified
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/bmrb-validation.json'))
          assert payload['benchmark'] == 'BMRB_KNOWN_TRUTH_VALIDATION_V1'
          assert payload['qualified'] is True
          assert payload['missing_pair_rejected'] is True
          summaries = {item['scenario_id']: item for item in payload['scenario_summaries']}
          assert summaries['effect-null']['observed_pass_rate'] == 0.0
          assert summaries['shared-mechanism-positive']['observed_pass_rate'] == 1.0
          assert summaries['predictive-shortcut']['observed_pass_rate'] == 0.0
          assert summaries['calibration-reversal']['observed_pass_rate'] == 1.0

          stress = payload['stress_suite']
          assert stress['benchmark'] == 'BMRB_KNOWN_TRUTH_STRESS_V1'
          assert stress['qualified'] is True
          stress_summaries = {
              item['scenario_id']: item for item in stress['scenario_summaries']
          }
          assert stress_summaries['equivalence-null-naive-trap']['bmrb_pass_rate'] == 0.0
          assert stress_summaries['equivalence-null-naive-trap'][
              'naive_primary_effect_pass_rate'
          ] == 1.0
          assert stress_summaries['predictive-shortcut-naive-trap'][
              'naive_primary_effect_pass_rate'
          ] == 1.0
          assert stress_summaries['calibration-reversal-naive-trap'][
              'bmrb_pass_rate'
          ] == 1.0
          assert stress_summaries['calibration-reversal-naive-trap'][
              'naive_budget_averaged_effect_pass_rate'
          ] == 0.0
          assert stress_summaries['noisy-repeated-sessions-positive'][
              'bmrb_pass_rate'
          ] == 1.0
          PY

      - name: Qualify participant-dependence stress surface
        run: |
          python - <<'PY'
          from quantumbci.bmrb_validation_dependence import (
              run_bmrb_dependence_stress_suite,
          )

          result = run_bmrb_dependence_stress_suite(
              replicates=4,
              seed=3901,
              bootstrap_resamples=100,
          )
          assert result['benchmark'] == 'BMRB_KNOWN_TRUTH_DEPENDENCE_STRESS_V1'
          assert result['qualified'] is True
          summaries = {item['scenario_id']: item for item in result['scenario_summaries']}
          majority = summaries['majority-responder-imbalanced-positive']
          minority = summaries['minority-responder-overweight-trap']
          assert majority['bmrb_pass_rate'] == 1.0
          assert majority['row_weighted_effect_pass_rate'] == 0.0
          assert minority['bmrb_pass_rate'] == 0.0
          assert minority['row_weighted_effect_pass_rate'] == 1.0
          assert minority['expected_failure_localization_rate'] == 1.0
          missing = result['structured_missing_pair']
          assert missing['rejected'] is True
          assert missing['classification'] == 'software_invalid'
          assert missing['scientific_negative'] is False
          PY

      - name: Qualify frozen operating-characteristics surface
        run: |
          python - <<'PY'
          from pathlib import Path
          from quantumbci.bmrb_validation_operating import (
              BMRBOperatingStudyPolicy,
              qualification_smoke_grid,
              run_bmrb_operating_characteristics,
              write_bmrb_operating_characteristics,
          )
          from quantumbci.bmrb_validation_operating_artifacts import (
              load_bmrb_operating_characteristics,
          )

          policy = BMRBOperatingStudyPolicy(
              study_id='ci-installed-operating-characteristics',
              source_sha='github-actions',
              partition='development',
              grid=qualification_smoke_grid(),
              replicates_per_cell=2,
              bootstrap_resamples=100,
          )
          result = run_bmrb_operating_characteristics(policy)
          by_scenario = {cell.scenario_id: cell for cell in result.cells}
          assert by_scenario['effect-null'].observed_pass_rate == 0.0
          assert by_scenario['equivalence-null'].observed_pass_rate == 0.0
          assert by_scenario['shared-mechanism-positive'].observed_pass_rate == 1.0
          assert by_scenario['calibration-reversal'].observed_pass_rate == 1.0
          assert result.scientific_payload()['qualification_defined'] is False
          output = write_bmrb_operating_characteristics(
              result,
              Path('/tmp/bmrb-operating.json'),
          )
          loaded = load_bmrb_operating_characteristics(output)
          assert loaded['artifact_fingerprint'] == result.artifact_fingerprint
          PY

      - name: Qualify preregistered final-evaluation seal
        run: |
          python - <<'PY'
          from pathlib import Path

          from quantumbci.bmrb_evaluation_seal import (
              BMRBEvaluationSeal,
              BMRBOperatingAcceptancePlan,
              OperatingAcceptanceCriterion,
              load_bmrb_evaluation_seal,
              write_bmrb_evaluation_seal,
          )
          from quantumbci.bmrb_validation_operating import (
              BMRBOperatingStudyPolicy,
              OperatingCurveGrid,
          )
          from quantumbci.preregistration import PreregistrationEvidence

          evaluation_policy = BMRBOperatingStudyPolicy(
              study_id='ci-sealed-evaluation',
              source_sha='github-actions',
              partition='evaluation',
              grid=OperatingCurveGrid(
                  scenario_ids=(
                      'equivalence-null',
                      'predictive-shortcut',
                      'shared-mechanism-positive',
                  ),
                  participant_counts=(8,),
                  effect_scales=(1.0,),
                  heterogeneity_scales=(1.0,),
                  measurement_noise_scales=(1.0,),
              ),
              replicates_per_cell=2,
              bootstrap_resamples=100,
          )
          criteria = (
              OperatingAcceptanceCriterion(
                  criterion_id='false-promotion',
                  metric='aggregate.false_promotion_rate',
                  upper_bound=0.20,
                  rationale='CI-only threshold used to qualify serialization.',
              ),
              OperatingAcceptanceCriterion(
                  criterion_id='positive-recovery',
                  metric='aggregate.known_positive_recovery_rate',
                  lower_bound=0.80,
                  rationale='CI-only threshold used to qualify serialization.',
              ),
              OperatingAcceptanceCriterion(
                  criterion_id='equivalence-null',
                  metric='scenario.observed_pass_rate',
                  scenario_id='equivalence-null',
                  reducer='maximum',
                  upper_bound=0.20,
                  rationale='CI-only explicit equivalence-null endpoint.',
              ),
              OperatingAcceptanceCriterion(
                  criterion_id='predictive-shortcut',
                  metric='scenario.observed_pass_rate',
                  scenario_id='predictive-shortcut',
                  reducer='maximum',
                  upper_bound=0.20,
                  rationale='CI-only explicit shortcut endpoint.',
              ),
              OperatingAcceptanceCriterion(
                  criterion_id='shared-positive',
                  metric='scenario.observed_pass_rate',
                  scenario_id='shared-mechanism-positive',
                  reducer='minimum',
                  lower_bound=0.80,
                  rationale='CI-only explicit known-positive endpoint.',
              ),
          )
          plan = BMRBOperatingAcceptancePlan(
              study_id='ci-final-evaluation-seal',
              development_evidence_ref='artifact://ci/development.json',
              development_artifact_fingerprint='a' * 64,
              development_policy_fingerprint='b' * 64,
              development_seed_partition_fingerprint=(
                  evaluation_policy.seed_partition.fingerprint
              ),
              evaluation_policy=evaluation_policy,
              criteria=criteria,
              multiplicity_policy='CI-only: report every declared criterion.',
              scientific_rationale='Qualify sealing mechanics without choosing scientific defaults.',
          )
          preregistration = PreregistrationEvidence(
              registration_uri='https://registry.example.invalid/ci-bmrb-seal',
              registered_at='2026-08-28T21:30:00Z',
              registration_document_sha256='c' * 64,
              registered_policy_sha256=plan.plan_fingerprint,
              registry='CI-only example registry',
          )
          seal = BMRBEvaluationSeal(plan=plan, preregistration=preregistration)
          output = write_bmrb_evaluation_seal(seal, Path('/tmp/bmrb-evaluation-seal.json'))
          loaded = load_bmrb_evaluation_seal(output)
          assert loaded['plan']['plan_fingerprint'] == plan.plan_fingerprint
          assert loaded['evaluation_executed'] is False
          source = Path('quantumbci/bmrb_evaluation_seal.py').read_text(encoding='utf-8')
          assert 'run_bmrb_operating_characteristics' not in source
          PY

      - name: Keep validation claim boundary explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('quantumbci/bmrb_validation.py').read_text(encoding='utf-8')
          stress = Path('quantumbci/bmrb_validation_stress.py').read_text(encoding='utf-8')
          dependence = Path('quantumbci/bmrb_validation_dependence.py').read_text(encoding='utf-8')
          operating = Path('quantumbci/bmrb_validation_operating.py').read_text(encoding='utf-8')
          operating_artifacts = Path(
              'quantumbci/bmrb_validation_operating_artifacts.py'
          ).read_text(encoding='utf-8')
          seal = Path('quantumbci/bmrb_evaluation_seal.py').read_text(encoding='utf-8')
          docs = Path('docs/BMRB_VALIDATION.md').read_text(encoding='utf-8')
          dependence_docs = Path('docs/BMRB_DEPENDENCE_STRESS.md').read_text(encoding='utf-8')
          operating_docs = Path('docs/BMRB_OPERATING_CHARACTERISTICS.md').read_text(encoding='utf-8')
          seal_docs = Path('docs/BMRB_EVALUATION_SEAL.md').read_text(encoding='utf-8')
          assert 'does not validate biological truth' in source
          assert 'not biological truth' in stress
          assert 'not biological models' in dependence
          assert 'software_invalid' in dependence
          assert 'qualification_defined": False' in operating
          assert 'validate biological truth' in operating
          assert 'integrity checks, not signatures' in operating_artifacts
          assert 'does not execute the final evaluation partition' in seal
          assert 'never supplied as scientific defaults' in seal
          assert 'not a certificate of biological truth' in docs
          assert 'does **not** validate biological realism' in dependence_docs
          assert 'do **not** establish' in operating_docs
          assert 'does not run the evaluation partition' in seal_docs
          assert 'physical quantum' in docs.lower()
          assert 'physical-quantum' in dependence_docs.lower()
          assert 'physical quantum' in operating_docs.lower()
          assert 'physical-quantum' in seal_docs.lower()
          PY

      - name: Qualify version-forward validation release surface and wheel
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import re
          import tomllib

          installed = version('quantum-bci')
          declared = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          assert installed == declared
          citation = Path('CITATION.cff').read_text(encoding='utf-8')
          match = re.search(r'^version:\s*["\x27]?([^"\x27\s]+)["\x27]?\s*$', citation, re.MULTILINE)
          assert match and match.group(1) == declared
          assert Path('docs/BMRB_VALIDATION.md').is_file()
          assert Path('docs/BMRB_DEPENDENCE_STRESS.md').is_file()
          assert Path('docs/BMRB_OPERATING_CHARACTERISTICS.md').is_file()
          assert Path('docs/BMRB_EVALUATION_SEAL.md').is_file()
          PY
          rm -rf /tmp/qbc-validation-wheel
          python -m pip wheel . --no-deps --wheel-dir /tmp/qbc-validation-wheel
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path('/tmp/qbc-validation-wheel').glob('quantum_bci-*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          expected = {
              'quantumbci/bmrb_validation.py',
              'quantumbci/bmrb_validation_stress.py',
              'quantumbci/bmrb_validation_dependence.py',
              'quantumbci/bmrb_validation_operating.py',
              'quantumbci/bmrb_validation_operating_artifacts.py',
              'quantumbci/bmrb_evaluation_seal.py',
              'quantumbci/bmrb_validation_cli.py',
          }
          missing = sorted(expected - names)
          assert not missing, missing
          PY
