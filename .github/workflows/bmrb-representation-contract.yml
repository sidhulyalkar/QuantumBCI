name: BMRB representation contract

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quantumbci-bmrb-representation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - name: Qualify representation conservation and artifact contracts
        run: |
          python -m pytest -q \
            tests/test_representation_conservation.py \
            tests/test_representation_studies.py \
            tests/test_bmrb_representation.py \
            tests/test_longitudinal.py \
            tests/test_recapitulation.py

      - name: Qualify v0.17+ representation public API compatibility
        run: |
          quantumbci-bmrb representation --help
          python - <<'PY'
          from importlib.metadata import version
          import quantumbci

          release = tuple(int(part) for part in version('quantum-bci').split('.')[:2])
          assert release >= (0, 17)
          assert quantumbci.BMRB_REPRESENTATION_BENCHMARK == 'BMRB_REPRESENTATION_V1'
          assert quantumbci.REPRESENTATION_CONSERVATION_METHOD_ID == 'participant_balanced_cross_representation_v1'
          assert quantumbci.E001_REPRESENTATION_LANE_SCHEMA == 'quantumbci.e001-representation-lane.v1'
          assert callable(quantumbci.encode_frozen_epochs)
          assert callable(quantumbci.write_e001_representation_lane_bundle)
          assert callable(quantumbci.evaluate_representation_conservation)
          assert callable(quantumbci.build_representation_necessity_profile)
          assert callable(quantumbci.build_bmrb_representation_bundle)
          assert callable(quantumbci.verify_bmrb_representation_mapping)
          PY

      - name: Keep conservation novelty causal and physical claims separate
        run: |
          python - <<'PY'
          from pathlib import Path

          conservation = Path('quantumbci/representation_conservation.py').read_text(encoding='utf-8')
          bundle = Path('quantumbci/bmrb_representation.py').read_text(encoding='utf-8')
          assert 'conservation_criteria_passed' in conservation
          assert 'adversary_survival_passed' in conservation
          assert 'information_novel_representation_fraction' in conservation
          assert 'causal_intervention_and_ablation' in conservation
          assert 'physical_quantum_promotion_eligible' in conservation
          assert 'artifact_fingerprint' in bundle
          assert 'verify_run_artifacts' in bundle
          PY

      - name: Qualify wheel contents
        run: |
          rm -rf /tmp/quantumbci-bmrb-representation-wheel
          python -m pip wheel . --no-deps --wheel-dir /tmp/quantumbci-bmrb-representation-wheel
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import zipfile

          wheels = list(Path('/tmp/quantumbci-bmrb-representation-wheel').glob('quantum_bci-*.whl'))
          assert len(wheels) == 1, wheels
          assert f"quantum_bci-{version('quantum-bci')}-" in wheels[0].name
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          expected = {
              'quantumbci/bmrb_representation.py',
              'quantumbci/representation_conservation.py',
              'quantumbci/representation_studies.py',
              'quantumbci/bmrb_cli.py',
              'quantumbci/longitudinal.py',
              'quantumbci/integrations/neuros.py',
          }
          missing = sorted(expected - names)
          assert not missing, f'v0.17 representation modules missing from wheel: {missing}'
          PY

  neuros-foundation-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QuantumBCI
        uses: actions/checkout@v7
      - name: Checkout pinned neurOS authority and foundation contracts
        uses: actions/checkout@v7
        with:
          repository: sidhulyalkar/neurOS-v1
          ref: ffa28ed552dc75158b673fdcd70729b1c9c69b47
          path: _deps/neuros-v1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install pinned neurOS public packages
        run: |
          python -m pip install -e _deps/neuros-v1/packages/neuros-core
          python -m pip install -e _deps/neuros-v1/packages/neuros-models
          python -m pip install -e _deps/neuros-v1/packages/neuros-foundation
          python -m pip install -e '.[dev]'
      - name: Qualify frozen foundation encoder seam without model downloads
        run: |
          python - <<'PY'
          import numpy as np

          from quantumbci.integrations.neuros import NeurOSFoundationEncoder
          from quantumbci.representation_studies import encode_frozen_epochs

          class FrozenAdapter:
              def encode(self, epoch):
                  x = np.asarray(epoch, dtype=float)
                  return np.stack([x.mean(axis=-1), x.std(axis=-1)], axis=0)

          encoder = NeurOSFoundationEncoder(FrozenAdapter())
          epochs = np.arange(4 * 3 * 16, dtype=float).reshape(4, 3, 16)
          values = encode_frozen_epochs(epochs, encoder, sample_rate_hz=128.0)
          assert values.shape == (4, 2, 3)
          assert np.all(np.isfinite(values))
          PY

      - name: Qualify real neurOS longitudinal authority remains compatible
        run: >-
          python -m pytest -q
          tests/test_neuros_integration.py
          tests/test_neuros_real_contracts.py
