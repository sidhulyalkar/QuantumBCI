name: BMRB study evaluation seal contract

on:
  pull_request:
    paths:
      - "quantumbci/bmrb_study_evaluation_seal.py"
      - "quantumbci/bmrb_study_operating_artifacts.py"
      - "quantumbci/bmrb_study_operating.py"
      - "quantumbci/bmrb_study_replication.py"
      - "quantumbci/bmrb_study_sensitivity.py"
      - "quantumbci/bmrb_multiplicity.py"
      - "quantumbci/bmrb_adaptive_search.py"
      - "quantumbci/preregistration.py"
      - "tests/test_bmrb_study_evaluation_seal.py"
      - "docs/BMRB_STUDY_EVALUATION_SEAL.md"
      - ".github/workflows/bmrb-study-evaluation-seal-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study-evaluation-seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - name: Qualify study evaluation seal semantics
        run: python -m pytest -q tests/test_bmrb_study_evaluation_seal.py

      - name: Static-check study evaluation authority
        run: |
          python -m ruff check \
            quantumbci/bmrb_study_evaluation_seal.py \
            quantumbci/bmrb_study_operating_artifacts.py \
            tests/test_bmrb_study_evaluation_seal.py

      - name: Exercise installed artifact verification without final evaluation
        run: |
          python - <<'PY'
          from quantumbci.bmrb_study_operating import (
              BMRBStudyOperatingPolicy,
              qualification_smoke_grid,
              run_bmrb_study_operating_characteristics,
          )
          from quantumbci.bmrb_study_operating_artifacts import (
              verify_bmrb_study_operating_mapping,
          )

          development = BMRBStudyOperatingPolicy(
              study_id="ci-study-seal-development",
              source_sha="ci-merge-ref",
              partition="development",
              grid=qualification_smoke_grid(),
              replicates_per_cell=1,
              bootstrap_resamples=100,
          )
          artifact = run_bmrb_study_operating_characteristics(development).to_mapping()
          verify_bmrb_study_operating_mapping(artifact)
          assert artifact["qualification_defined"] is False
          assert artifact["evaluation_partition_executed"] is False
          assert artifact["physical_quantum_promotion_eligible"] is False
          PY

      - name: Keep final evaluation and claim ceilings sealed
        run: |
          python - <<'PY'
          from pathlib import Path

          seal = Path("quantumbci/bmrb_study_evaluation_seal.py").read_text(encoding="utf-8")
          verifier = Path("quantumbci/bmrb_study_operating_artifacts.py").read_text(encoding="utf-8")
          docs = Path("docs/BMRB_STUDY_EVALUATION_SEAL.md").read_text(encoding="utf-8")

          assert "does not execute the study-level evaluation partition" in seal
          assert "adaptive discovery never defines the confirmatory evidence set" in seal
          assert '"sensitivity_promotion_authoritative": False' in seal
          assert '"physical_quantum_promotion_eligible": False' in seal
          assert "run_bmrb_study_operating_characteristics" not in seal
          assert "evaluation_partition_executed" in verifier
          assert "Fingerprints are integrity checks, not signatures" in docs
          assert "final study-level evaluation partition remains sealed and unexecuted" in docs
          assert "random-effects" in docs
          assert "physical-quantum" in docs
          PY

      - name: Qualify wheel contents
        run: |
          rm -rf dist build *.egg-info
          python -m build --wheel
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "quantumbci/bmrb_study_evaluation_seal.py" in names
          assert "quantumbci/bmrb_study_operating_artifacts.py" in names
          PY
