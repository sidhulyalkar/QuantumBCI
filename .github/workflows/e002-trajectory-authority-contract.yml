name: E002 trajectory authority contract

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quantumbci-e002-trajectory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - name: Build portable fixed-window trajectory fixture
        run: |
          mkdir -p /tmp/e002-trajectory
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np

          root = Path('/tmp/e002-trajectory')
          states = np.asarray(
              [[0.1 * i, np.sin(i), np.cos(i)] for i in range(12)],
              dtype=np.float64,
          )
          trajectory_ids = np.asarray(['source'] * 6 + ['target'] * 6)
          starts = np.asarray(list(range(6)) + list(range(6)), dtype=float)
          stops = starts + 1.0
          np.save(root / 'states.npy', states)
          np.save(root / 'trajectory_ids.npy', trajectory_ids)
          np.save(root / 'starts.npy', starts)
          np.save(root / 'stops.npy', stops)
          descriptor = {
              'schema_version': 1,
              'dataset_id': 'ci-continuous',
              'case_id': 'ci-subject/recording-01',
              'latent_dimension': 3,
              'time_step_policy': 'fixed',
              'expected_window_seconds': 1.0,
              'expected_step_seconds': 1.0,
              'step_tolerance_seconds': 1e-9,
              'purge_seconds': 1.0,
              'upstream_authority_fingerprint': 'neuros-ci-authority',
              'source_revisions': {
                  'quantumbci': 'ci-head',
                  'neuros': 'ffa28ed552dc75158b673fdcd70729b1c9c69b47',
              },
              'data_metadata': {'encoder': 'ci-frozen-encoder'},
              'data': {
                  'states': 'states.npy',
                  'trajectory_ids': 'trajectory_ids.npy',
                  'start_times_s': 'starts.npy',
                  'stop_times_s': 'stops.npy',
              },
              'split': {
                  'fit_indices': [5, 4, 3, 2, 1, 0],
                  'calibration_indices': [7, 6],
                  'evaluation_indices': [11, 10, 9],
                  'representation_fit_indices': [3, 2, 1, 0],
              },
          }
          (root / 'trajectory_contract.json').write_text(
              json.dumps(descriptor, indent=2), encoding='utf-8'
          )
          PY

      - name: Qualify executable trajectory authority stage
        run: |
          cd /tmp/e002-trajectory
          python -m quantumbci.experiments.tasks \
            trajectory-contract E002 \
            --input trajectory_contract.json \
            --output trajectory_index.json \
            > trajectory_stdout.json
          python - <<'PY'
          import json
          artifact = json.load(open('trajectory_index.json'))
          authority = artifact['authority']
          shared = artifact['shared_tensor_contract']
          assert artifact['status'] == 'pass'
          assert artifact['descriptor_name'] == 'trajectory_contract.json'
          assert authority['fit_indices'] == [0, 1, 2, 3, 4, 5]
          assert authority['calibration_indices'] == [6, 7]
          assert authority['evaluation_indices'] == [9, 10, 11]
          assert authority['representation_fit_indices'] == [0, 1, 2, 3]
          assert authority['transition_counts'] == {'fit': 5, 'calibration': 1, 'evaluation': 2}
          assert authority['expected_window_seconds'] == 1.0
          assert authority['expected_step_seconds'] == 1.0
          assert authority['purge_seconds'] == 1.0
          assert authority['upstream_authority_fingerprint'] == 'neuros-ci-authority'
          assert len(authority['authority_fingerprint']) == 16
          assert len(shared['data_sha256']) == 64
          assert shared['data_sha256'] == authority['data_sha256']
          assert shared['required_for_all_model_lanes'] is True
          # Artifact navigation metadata must not leak runner-specific absolute paths.
          rendered = json.dumps(artifact)
          assert '/tmp/' not in rendered
          PY

      - name: Qualify adversarial temporal leakage contracts
        run: |
          python -m pytest -q tests/test_trajectory_authority.py tests/test_experiment_tasks.py

      - name: Confirm downstream model fitting remains fail-closed
        run: |
          set +e
          python -m quantumbci.experiments.tasks fit-lindblad E002 > /tmp/fit-lindblad.json
          code=$?
          set -e
          test "$code" -eq 3
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/fit-lindblad.json'))
          assert payload['status'] == 'not_implemented'
          PY

      - name: Qualify manifest schema and wheel contents
        run: |
          quantumbci experiments validate E002_lindblad_dynamics --json
          python - <<'PY'
          from pathlib import Path
          import json
          source = json.loads(Path('experiments/manifests/E002_lindblad_dynamics.json').read_text())
          packaged = json.loads(Path('quantumbci/experiments/manifests/E002_lindblad_dynamics.json').read_text())
          assert source == packaged
          schema = json.loads(Path('quantumbci/schemas/trajectory-contract-v1.schema.json').read_text())
          assert schema['properties']['time_step_policy']['const'] == 'fixed'
          assert schema['properties']['split']['required'] == [
              'fit_indices', 'calibration_indices', 'evaluation_indices', 'representation_fit_indices'
          ]
          PY
          python -m pip wheel . --no-deps --wheel-dir /tmp/quantumbci-wheel
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheels = list(Path('/tmp/quantumbci-wheel').glob('quantum_bci-*.whl'))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          expected = {
              'quantumbci/trajectory_authority.py',
              'quantumbci/schemas/trajectory-contract-v1.schema.json',
              'quantumbci/experiments/manifests/E002_lindblad_dynamics.json',
          }
          missing = sorted(expected - names)
          assert not missing, f'trajectory authority files missing from wheel: {missing}'
          PY
