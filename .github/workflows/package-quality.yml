name: Package quality contract

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantumbci-package-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build-quality tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build>=1.2' 'twine>=5,<7'

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata and release identity
        run: |
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          import re
          import tomllib

          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']
          version = project['version']
          citation = Path('CITATION.cff').read_text(encoding='utf-8')
          match = re.search(r'^version:\s*["\x27]?([^"\x27\s]+)["\x27]?\s*$', citation, re.MULTILINE)
          assert match, 'CITATION.cff is missing a top-level version'
          assert match.group(1) == version, (match.group(1), version)

          wheels = list(Path('dist').glob(f'quantum_bci-{version}-*.whl'))
          sdists = list(Path('dist').glob(f'quantum_bci-{version}.tar.gz'))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          PY

      - name: Install and exercise wheel from a clean environment
        run: |
          EXPECTED_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          WHEEL=$(python -c "from pathlib import Path; print(next(Path('dist').glob('quantum_bci-*.whl')).resolve())")
          python -m venv /tmp/quantumbci-wheel
          /tmp/quantumbci-wheel/bin/python -m pip install --upgrade pip
          /tmp/quantumbci-wheel/bin/python -m pip install "$WHEEL"
          /tmp/quantumbci-wheel/bin/python -m pip check
          cd /tmp
          /tmp/quantumbci-wheel/bin/python -c "from importlib.metadata import version; assert version('quantum-bci') == '$EXPECTED_VERSION'"
          /tmp/quantumbci-wheel/bin/python -c "import quantumbci; assert quantumbci.ClaimClass.QUANTUM_INSPIRED.value == 'quantum_inspired'"
          /tmp/quantumbci-wheel/bin/quantumbci --version
          /tmp/quantumbci-wheel/bin/quantumbci doctor --json
          /tmp/quantumbci-wheel/bin/quantumbci-audit --help
          /tmp/quantumbci-wheel/bin/quantumbci-kumar2024 --help
          /tmp/quantumbci-wheel/bin/quantumbci-bmrb --help
          /tmp/quantumbci-wheel/bin/quantumbci-confirmatory --help
          /tmp/quantumbci-wheel/bin/quantumbci-bmrb-validate --help

      - name: Install and exercise sdist from a clean environment
        run: |
          EXPECTED_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          SDIST=$(python -c "from pathlib import Path; print(next(Path('dist').glob('quantum_bci-*.tar.gz')).resolve())")
          python -m venv /tmp/quantumbci-sdist
          /tmp/quantumbci-sdist/bin/python -m pip install --upgrade pip
          /tmp/quantumbci-sdist/bin/python -m pip install "$SDIST"
          /tmp/quantumbci-sdist/bin/python -m pip check
          cd /tmp
          /tmp/quantumbci-sdist/bin/python -c "from importlib.metadata import version; assert version('quantum-bci') == '$EXPECTED_VERSION'"
          /tmp/quantumbci-sdist/bin/quantumbci --version

      - name: Materialize artifact checksums
        run: |
          cd dist
          sha256sum quantum_bci-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload qualified package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantum-bci-package-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
