name: E002 matched dynamics contract

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quantumbci-e002-matched-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - name: Qualify v0.9 matched-dynamics science and task contracts
        run: |
          python -m pytest -q tests/test_dynamics_fitting.py tests/test_experiment_tasks.py

      - name: Qualify v0.9 immediate downstream handoff
        run: |
          quantumbci experiments validate E002_lindblad_dynamics --json
          python - <<'PY'
          from pathlib import Path
          import json
          source = json.loads(Path('experiments/manifests/E002_lindblad_dynamics.json').read_text())
          packaged = json.loads(Path('quantumbci/experiments/manifests/E002_lindblad_dynamics.json').read_text())
          assert source == packaged
          stages = {stage['id']: stage for stage in source['stages']}
          matched = stages['fit_matched_baseline']
          child = stages['fit_extended_classical_controls']
          assert matched['depends_on'] == ['trajectory_contract']
          assert matched['command'][:3] == ['python', '-m', 'quantumbci.experiments.tasks']
          assert 'fit-matched-dynamics' in matched['command']
          assert matched['command'][-1] == '0'
          assert matched['produces'] == ['matched_dynamics.json']
          assert child['depends_on'] == ['fit_matched_baseline']
          assert child['command'][:3] == [
              'python', '-m', 'quantumbci.experiments.classical_controls_task'
          ]
          PY

      - name: Keep legacy unmatched control route fail-closed
        run: |
          set +e
          python -m quantumbci.experiments.tasks fit-dynamics-controls E002 --input /tmp/not-used.json > /tmp/legacy-controls.json
          code=$?
          set -e
          test "$code" -eq 3
          python - <<'PY'
          import json
          assert json.load(open('/tmp/legacy-controls.json'))['status'] == 'not_implemented'
          PY

      - name: Qualify v0.9 wheel contents
        run: |
          rm -rf /tmp/quantumbci-matched-wheel
          python -m pip wheel . --no-deps --wheel-dir /tmp/quantumbci-matched-wheel
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheels = list(Path('/tmp/quantumbci-matched-wheel').glob('quantum_bci-*.whl'))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          expected = {
              'quantumbci/dynamics_fitting.py',
              'quantumbci/trajectory_authority.py',
              'quantumbci/experiments/manifests/E002_lindblad_dynamics.json',
          }
          assert not sorted(expected - names)
          PY
