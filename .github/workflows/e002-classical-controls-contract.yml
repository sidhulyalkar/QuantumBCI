name: E002 classical controls contract

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quantumbci-e002-controls-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - name: Qualify v0.10 observed-state classical controls
        run: |
          python -m pytest -q tests/test_classical_dynamics.py tests/test_classical_controls_task.py

      - name: Qualify v0.10 immediate downstream handoff
        run: |
          quantumbci experiments validate E002_lindblad_dynamics --json
          python - <<'PY'
          from pathlib import Path
          import json
          source = json.loads(Path('experiments/manifests/E002_lindblad_dynamics.json').read_text())
          packaged = json.loads(Path('quantumbci/experiments/manifests/E002_lindblad_dynamics.json').read_text())
          assert source == packaged
          stages = {stage['id']: stage for stage in source['stages']}
          control = stages['fit_extended_classical_controls']
          child = stages['fit_probabilistic_state_space_control']
          assert control['depends_on'] == ['fit_matched_baseline']
          assert control['command'][:3] == [
              'python', '-m', 'quantumbci.experiments.classical_controls_task'
          ]
          assert control['produces'] == ['classical_controls.json']
          assert child['depends_on'] == ['fit_extended_classical_controls']
          assert child['command'][:3] == [
              'python', '-m', 'quantumbci.experiments.probabilistic_ssm_task'
          ]
          PY

      - name: Keep interventions and legacy unmatched routes fail-closed
        run: |
          set +e
          python -m quantumbci.experiments.tasks dynamics-interventions E002 > /tmp/v010-interventions.json
          interventions_code=$?
          python -m quantumbci.experiments.tasks fit-dynamics-controls E002 --input /tmp/not-used.json > /tmp/legacy-controls.json
          legacy_code=$?
          set -e
          test "$interventions_code" -eq 3
          test "$legacy_code" -eq 3
          python - <<'PY'
          import json
          assert json.load(open('/tmp/v010-interventions.json'))['status'] == 'not_implemented'
          assert json.load(open('/tmp/legacy-controls.json'))['status'] == 'not_implemented'
          PY

      - name: Qualify v0.10 wheel contents
        run: |
          rm -rf /tmp/quantumbci-controls-wheel
          python -m pip wheel . --no-deps --wheel-dir /tmp/quantumbci-controls-wheel
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheels = list(Path('/tmp/quantumbci-controls-wheel').glob('quantum_bci-*.whl'))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          expected = {
              'quantumbci/classical_dynamics.py',
              'quantumbci/experiments/classical_controls_task.py',
              'quantumbci/experiments/manifests/E002_lindblad_dynamics.json',
          }
          assert not sorted(expected - names)
          PY
