name: E001 Kumar2024 contract

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quantumbci-kumar2024-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEUROS_SHA: ffa28ed552dc75158b673fdcd70729b1c9c69b47

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QuantumBCI
        uses: actions/checkout@v7
      - name: Checkout exact merged neurOS authority
        uses: actions/checkout@v7
        with:
          repository: sidhulyalkar/neurOS-v1
          ref: ${{ env.NEUROS_SHA }}
          path: _deps/neuros-v1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install merged neurOS contracts
        run: |
          python -m pip install -e _deps/neuros-v1/packages/neuros-core
          python -m pip install -e _deps/neuros-v1/packages/neuros-models
          python -m pip install -e _deps/neuros-v1/packages/neuros-foundation
      - name: Install QuantumBCI
        run: python -m pip install -e '.[dev]'
      - name: Qualify installed study surface
        run: |
          quantumbci-kumar2024 --help
          python - <<'PY'
          import quantumbci.studies as studies
          assert studies.run_kumar2024_study.__module__.endswith('kumar2024_execution')
          assert studies.run_kumar2024_subject.__module__.endswith('kumar2024_execution')
          PY
      - name: Qualify cached study against real neurOS authority contracts
        run: >-
          python -m pytest -q
          tests/test_kumar2024_neuros_study.py
          tests/test_neuros_real_contracts.py
      - name: Qualify wheel study modules
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/quantumbci-wheel
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path('/tmp/quantumbci-wheel').glob('quantum_bci-*.whl'))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          expected = {
              'quantumbci/e001_prepared.py',
              'quantumbci/e001_longitudinal_prepared.py',
              'quantumbci/studies/__init__.py',
              'quantumbci/studies/kumar2024.py',
              'quantumbci/studies/kumar2024_execution.py',
              'quantumbci/studies/kumar2024_cli.py',
          }
          missing = sorted(expected - names)
          assert not missing, f'Kumar2024 execution modules missing from wheel: {missing}'
          PY
