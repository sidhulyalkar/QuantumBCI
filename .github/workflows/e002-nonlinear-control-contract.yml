name: E002 nonlinear control contract

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quantumbci-e002-nonlinear-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - name: Qualify nonlinear kernel and authority-bound task
        run: |
          python -m pytest -q tests/test_nonlinear_dynamics.py tests/test_nonlinear_control_task.py

      - name: Qualify safe root nonlinear surface
        run: |
          python - <<'PY'
          import quantumbci
          assert quantumbci.NONLINEAR_MODEL_ID == 'affine_plus_rff_residual_v1'
          assert quantumbci.NONLINEAR_SCORE_ID == 'fit_variance_gaussian_one_step_plus_mean_rollout_v1'
          assert quantumbci.RFF_SEED == 1301
          assert quantumbci.FEATURE_COUNTS == (16, 32, 64)
          assert quantumbci.LENGTH_SCALE_MULTIPLIERS == (0.5, 1.0, 2.0)
          assert quantumbci.RIDGES == (1e-4, 1e-2, 1.0)
          assert callable(quantumbci.run_nonlinear_residual_control)
          assert callable(quantumbci.evaluate_nonlinear_model)
          PY

      - name: Build nonlinear fixed-step evidence fixture
        run: |
          mkdir -p /tmp/e002-nonlinear
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np

          root = Path('/tmp/e002-nonlinear')
          rng = np.random.default_rng(313)
          transitions = np.asarray([
              [[0.88, 0.15, 0.00], [-0.10, 0.83, 0.06], [0.03, -0.06, 0.85]],
              [[0.74, -0.18, 0.06], [0.16, 0.79, -0.09], [-0.04, 0.12, 0.80]],
          ], dtype=float)
          intercepts = np.asarray([
              [0.008, -0.005, 0.003],
              [-0.010, 0.009, -0.004],
          ], dtype=float)
          variances = np.asarray([
              [0.0010, 0.0010, 0.0009],
              [0.0009, 0.0011, 0.0010],
          ], dtype=float)
          regime_transition = np.asarray([[0.95, 0.05], [0.07, 0.93]], dtype=float)
          n_trajectories = 8
          n_steps = 80
          states = []
          ids = []
          for trajectory in range(n_trajectories):
              state = rng.normal(0.0, 0.18, size=3)
              regime = trajectory % 2
              for step in range(n_steps):
                  if step > 0:
                      regime = int(rng.choice(2, p=regime_transition[regime]))
                      nonlinear = np.asarray([
                          0.025 * np.sin(3.0 * state[1]),
                          0.020 * np.sin(3.0 * state[2]),
                          0.022 * np.sin(3.0 * state[0]),
                      ])
                      state = (
                          transitions[regime] @ state
                          + intercepts[regime]
                          + nonlinear
                          + rng.normal(0.0, np.sqrt(variances[regime]))
                      )
                  states.append(state.copy())
                  ids.append(f'trajectory-{trajectory}')
          states = np.asarray(states, dtype=float)
          starts = np.tile(np.arange(n_steps, dtype=float), n_trajectories)
          stops = starts + 0.5
          np.save(root / 'states.npy', states)
          np.save(root / 'ids.npy', np.asarray(ids))
          np.save(root / 'starts.npy', starts)
          np.save(root / 'stops.npy', stops)

          fit = []
          calibration = []
          evaluation = []
          for trajectory in range(n_trajectories):
              base = trajectory * n_steps
              fit.extend(range(base, base + 48))
              calibration.extend(range(base + 48, base + 64))
              evaluation.extend(range(base + 64, base + n_steps))

          descriptor = {
              'schema_version': 1,
              'dataset_id': 'ci-v013-nonlinear',
              'case_id': 'ci-v013-case',
              'latent_dimension': 3,
              'time_step_policy': 'fixed',
              'expected_window_seconds': 0.5,
              'expected_step_seconds': 1.0,
              'step_tolerance_seconds': 1e-12,
              'purge_seconds': 0.0,
              'upstream_authority_fingerprint': 'neuros-ci-v013',
              'source_revisions': {'quantumbci': 'ci-v013', 'encoder': 'frozen-ci'},
              'data_metadata': {'state_surface': 'observed_coordinates', 'fixture': 'v013'},
              'data': {
                  'states': 'states.npy',
                  'trajectory_ids': 'ids.npy',
                  'start_times_s': 'starts.npy',
                  'stop_times_s': 'stops.npy',
              },
              'split': {
                  'fit_indices': fit,
                  'calibration_indices': calibration,
                  'evaluation_indices': evaluation,
                  'representation_fit_indices': fit,
              },
          }
          (root / 'trajectory_contract.json').write_text(
              json.dumps(descriptor, indent=2), encoding='utf-8'
          )
          PY

      - name: Materialize v0.8 through v0.12 evidence chain
        run: |
          cd /tmp/e002-nonlinear
          python -m quantumbci.experiments.tasks \
            trajectory-contract E002 \
            --input trajectory_contract.json \
            --output trajectory_index.json \
            > trajectory_stdout.json
          python -m quantumbci.experiments.tasks \
            fit-matched-dynamics E002 \
            --input trajectory_contract.json \
            --trajectory-index trajectory_index.json \
            --output matched_dynamics.json \
            --ridge 0 \
            > matched_stdout.json
          python -m quantumbci.experiments.classical_controls_task \
            --descriptor trajectory_contract.json \
            --trajectory-index trajectory_index.json \
            --matched matched_dynamics.json \
            --output classical_controls.json \
            > controls_stdout.json
          python -m quantumbci.experiments.probabilistic_ssm_task \
            --descriptor trajectory_contract.json \
            --trajectory-index trajectory_index.json \
            --matched matched_dynamics.json \
            --classical-controls classical_controls.json \
            --output probabilistic_ssm.json \
            > probabilistic_stdout.json
          python -m quantumbci.experiments.switching_state_task \
            --descriptor trajectory_contract.json \
            --trajectory-index trajectory_index.json \
            --matched matched_dynamics.json \
            --classical-controls classical_controls.json \
            --probabilistic-ssm probabilistic_ssm.json \
            --output switching_state.json \
            > switching_stdout.json

      - name: Qualify installed v0.13 nonlinear stage
        run: |
          cd /tmp/e002-nonlinear
          python -m quantumbci.experiments.nonlinear_control_task \
            --descriptor trajectory_contract.json \
            --trajectory-index trajectory_index.json \
            --matched matched_dynamics.json \
            --classical-controls classical_controls.json \
            --probabilistic-ssm probabilistic_ssm.json \
            --switching-state switching_state.json \
            --output nonlinear_control.json \
            > nonlinear_stdout.json
          python - <<'PY'
          import json
          artifact = json.load(open('nonlinear_control.json'))
          switching = json.load(open('switching_state.json'))
          classical = json.load(open('classical_controls.json'))
          full = classical['controls']['full_var1']
          assert artifact['status'] == 'pass'
          assert artifact['artifact_role'] == 'flexible_nonlinear_classical_control'
          assert artifact['upstream_switching_artifact_verified'] is True
          assert artifact['upstream_switching_artifact_reconstructed'] is True
          assert artifact['affine_mean_source'] == 'v0.10:controls.full_var1'
          assert artifact['affine_mean_refit'] is False
          assert artifact['model']['affine_mean_refit'] is False
          assert artifact['model']['transition'] == full['transition']
          assert artifact['model']['intercept'] == full['intercept']
          assert artifact['model']['rff_seed'] == 1301
          assert artifact['model']['feature_count'] in [16, 32, 64]
          assert artifact['model']['length_scale_multiplier'] in [0.5, 1.0, 2.0]
          assert artifact['model']['ridge'] in [0.0001, 0.01, 1.0]
          assert len(artifact['model']['model_sha256']) == 64
          assert artifact['fit_authority_only_for_weights_and_standardization'] is True
          assert artifact['calibration_used_for_complexity_selection'] is True
          assert artifact['evaluation_used_for_model_selection'] is False
          assert artifact['one_step_gaussian_density_complete'] is True
          assert artifact['deterministic_mean_rollout_complete'] is True
          assert artifact['nonlinear_uncertainty_rollout_complete'] is False
          assert artifact['rollout_likelihood_promotion_eligible'] is False
          assert artifact['flexible_nonlinear_control_complete'] is True
          assert artifact['bootstrap_stability_required'] is True
          assert artifact['intervention_direction_evidence_required'] is True
          assert artifact['intervention_stage_eligible'] is False
          assert artifact['dynamical_information_novel'] is False
          assert artifact['physical_quantum_promotion_eligible'] is False
          assert set(artifact['matched_information_set_comparisons']) == {
              'direct_gaussian_var_minus_nonlinear_one_step_mean_nll',
              'direct_gaussian_var_minus_nonlinear_one_step_rmse',
              'full_var_minus_nonlinear_rollout_rmse',
          }
          assert set(artifact['comparison_exclusions']) == {
              'kalman_sequential', 'switching_sequential', 'nonlinear_rollout_likelihood'
          }
          for field in (
              'authority_fingerprint', 'data_sha256', 'fit_transition_sha256',
              'calibration_transition_sha256', 'evaluation_transition_sha256'
          ):
              assert artifact[field] == switching[field]
          assert '/tmp/' not in json.dumps(artifact)
          PY

      - name: Reject tampered v0.12 evidence before nonlinear fit
        run: |
          cd /tmp/e002-nonlinear
          cp switching_state.json switching_tampered.json
          python - <<'PY'
          import json
          path = 'switching_tampered.json'
          payload = json.load(open(path))
          payload['model']['regime_transition'][0][0] -= 0.1
          payload['model']['regime_transition'][0][1] += 0.1
          open(path, 'w').write(json.dumps(payload))
          PY
          rm -f should_not_exist.json
          set +e
          python -m quantumbci.experiments.nonlinear_control_task \
            --descriptor trajectory_contract.json \
            --trajectory-index trajectory_index.json \
            --matched matched_dynamics.json \
            --classical-controls classical_controls.json \
            --probabilistic-ssm probabilistic_ssm.json \
            --switching-state switching_tampered.json \
            --output should_not_exist.json \
            > tamper_stdout.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -f should_not_exist.json
          python - <<'PY'
          import json
          payload = json.load(open('tamper_stdout.json'))
          assert payload['status'] == 'error'
          assert 'independent v0.12 reconstruction' in payload['message']
          PY

      - name: Keep intervention route fail-closed
        run: |
          set +e
          python -m quantumbci.experiments.tasks dynamics-interventions E002 > /tmp/v013-interventions.json
          code=$?
          set -e
          test "$code" -eq 3
          python - <<'PY'
          import json
          assert json.load(open('/tmp/v013-interventions.json'))['status'] == 'not_implemented'
          PY

      - name: Qualify manifest identity and wheel contents
        run: |
          quantumbci experiments validate E002_lindblad_dynamics --json
          python - <<'PY'
          from pathlib import Path
          import json
          source = json.loads(Path('experiments/manifests/E002_lindblad_dynamics.json').read_text())
          packaged = json.loads(Path('quantumbci/experiments/manifests/E002_lindblad_dynamics.json').read_text())
          assert source == packaged
          stages = {stage['id']: stage for stage in source['stages']}
          nonlinear = stages['fit_flexible_nonlinear_control']
          assert nonlinear['depends_on'] == ['fit_switching_state_control']
          assert nonlinear['command'][:3] == [
              'python', '-m', 'quantumbci.experiments.nonlinear_control_task'
          ]
          for required in (
              '--descriptor', 'trajectory_contract.json',
              '--trajectory-index', 'trajectory_index.json',
              '--matched', 'matched_dynamics.json',
              '--classical-controls', 'classical_controls.json',
              '--probabilistic-ssm', 'probabilistic_ssm.json',
              '--switching-state', 'switching_state.json',
              '--output', 'nonlinear_control.json',
          ):
              assert required in nonlinear['command']
          assert nonlinear['produces'] == ['nonlinear_control.json']
          assert stages['interventions']['depends_on'] == [
              'fit_matched_baseline',
              'fit_extended_classical_controls',
              'fit_probabilistic_state_space_control',
              'fit_switching_state_control',
              'fit_flexible_nonlinear_control',
          ]
          PY
          python -m pip wheel . --no-deps --wheel-dir /tmp/quantumbci-nonlinear-wheel
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import zipfile
          wheels = list(Path('/tmp/quantumbci-nonlinear-wheel').glob('quantum_bci-*.whl'))
          assert len(wheels) == 1, wheels
          installed_version = version('quantum-bci')
          assert f'quantum_bci-{installed_version}-' in wheels[0].name
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          expected = {
              'quantumbci/nonlinear_dynamics.py',
              'quantumbci/experiments/nonlinear_control_task.py',
              'quantumbci/switching_dynamics.py',
              'quantumbci/experiments/switching_state_task.py',
              'quantumbci/experiments/manifests/E002_lindblad_dynamics.json',
          }
          missing = sorted(expected - names)
          assert not missing, f'nonlinear control files missing from wheel: {missing}'
          PY
